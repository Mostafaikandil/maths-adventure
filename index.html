<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ff7a59">
<title>Maths Adventure</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--accent:#ff7a59;--good:#2eb67d;--bad:#e5484d;--key:#e8eefc;--keyink:#1d3557;--line:#2b2d42;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d2e;--card:#262a41;--ink:#f1f3ff;--accent:#ff8f70;--good:#3ed598;--bad:#ff6b70;--key:#37406a;--keyink:#f1f3ff;--line:#f1f3ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Avenir Next",Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;align-items:center;min-height:100%}
h1{font-size:30px;margin:10px 0 4px;text-align:center}h2{margin:6px 0 10px}
.sub{opacity:.8;text-align:center;margin:0 0 16px}
.card{background:var(--card);border-radius:22px;padding:20px;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.12);text-align:center;margin-bottom:12px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;font-size:21px;font-weight:700;padding:13px 26px;margin-top:12px;cursor:pointer}
.btn.alt{background:var(--key);color:var(--keyink)}
.btn.sm{font-size:15px;padding:8px 14px;margin:0}
.lvl{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 18px;border-radius:16px;border:2px solid var(--key);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer}
.lvl[disabled]{opacity:.4}.lvl b{display:block;font-size:20px}
.lvl small{float:right;opacity:.75}
.top{display:flex;justify-content:space-between;width:100%;font-weight:700;font-size:16px;margin-bottom:8px}
.bar{height:10px;width:100%;background:var(--key);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--good);width:0}
.sum{display:inline-block;font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin:6px 0}
.row{display:flex;justify-content:flex-end;align-items:center;gap:18px;min-width:230px}
.row .op{font-size:54px;color:var(--accent);width:50px;text-align:left}
.row .num{letter-spacing:4px}
.rule{border-top:5px solid var(--line);margin:4px 0 6px;border-radius:3px}
#ans{display:flex;justify-content:flex-end;align-items:center;min-height:74px;border:3px dashed var(--accent);border-radius:14px;padding:0 14px;cursor:pointer;letter-spacing:4px}
#ans.active{border-style:solid;background:rgba(255,122,89,.1)}
#ans.good{border-color:var(--good);color:var(--good)}#ans.bad{border-color:var(--bad);color:var(--bad)}
#ans .hint{font-size:18px;letter-spacing:0;opacity:.6}
#msg{min-height:30px;font-size:21px;font-weight:700;margin-top:8px}
#pad{display:none;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:6px}
#pad.show{display:grid}
#pad button{font-size:30px;font-weight:700;padding:15px 0;border:0;border-radius:16px;background:var(--key);color:var(--keyink);cursor:pointer}
#pad .enter{background:var(--good);color:#fff}#pad .back{background:var(--bad);color:#fff}
.big{font-size:60px;margin:4px 0}.stars{font-size:42px;letter-spacing:6px}
input{font:inherit;font-size:24px;padding:12px;border-radius:14px;border:3px solid var(--key);width:100%;text-align:center;background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:9px 0;padding:16px 18px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.mod:nth-child(2){background:#4f7cff}.mod:nth-child(3){background:#9b5de5}
.mod .l{font-size:40px;font-weight:700}.mod b{display:block;font-size:21px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--key)}
.wr{text-align:left;font-size:15px;padding:6px 0;border-bottom:1px solid var(--key)}
.wr em{opacity:.65;font-style:normal;font-size:13px}
.foot{margin-top:auto;padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="maths_adventure_v2",PASS=20,TOTAL=25,NL=4;
var MODS={A:{n:"Addition",s:"+",c:"A"},B:{n:"Subtraction",s:"−",c:"B"},C:{n:"Mixed",s:"±",c:"C"}};
var LDESC={A:["2-digit, no carrying","2-digit with carrying","3-digit numbers","3-digit, carrying across hundreds"],
 B:["2-digit, no borrowing","2-digit with borrowing","3-digit minus 2-digit","3-digit, borrowing across hundreds"]};
LDESC.C=["Easy mix","Carry and borrow","3-digit mix","Hardest mix"];
var S=load(),mod="A",lvl=0,qs=[],qi=0,score=0,entry="",locked=false,wrongNow=[],resetArm=false;
var app=document.getElementById("app");
function blank(){return {name:"",prog:{A:1,B:1,C:1},best:{},plays:[],wrong:[]};}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.prog)return d;}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function r(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function uc(a,b){return a%10+b%10>=10;}
function tc(a,b){return ((a/10|0)%10)+((b/10|0)%10)+(uc(a,b)?1:0)>=10;}
function ub(a,b){return a%10<b%10;}
function tb(a,b){return ((a/10|0)%10)-(ub(a,b)?1:0)<((b/10|0)%10);}
function gen(t,L){
 for(var i=0;i<5000;i++){var a,b;
  if(t==="+"){
   if(L===0){a=r(11,89);b=r(1,89);if(a+b<=99&&!uc(a,b))return {a:a,b:b,op:t,ans:a+b};}
   else if(L===1){a=r(15,89);b=r(11,89);if(a+b<=99&&uc(a,b))return {a:a,b:b,op:t,ans:a+b};}
   else if(L===2){a=r(101,899);b=r(11,899);if(a+b<=999)return {a:a,b:b,op:t,ans:a+b};}
   else{a=r(120,899);b=r(110,899);if(a+b<=999&&uc(a,b)&&tc(a,b))return {a:a,b:b,op:t,ans:a+b};}
  }else{
   if(L===0){a=r(20,99);b=r(1,a-1);if(!ub(a,b))return {a:a,b:b,op:t,ans:a-b};}
   else if(L===1){a=r(30,99);b=r(11,a-1);if(ub(a,b))return {a:a,b:b,op:t,ans:a-b};}
   else if(L===2){a=r(101,999);b=r(11,99);if(ub(a,b))return {a:a,b:b,op:t,ans:a-b};}
   else{a=r(300,999);b=r(110,a-1);if(ub(a,b)&&tb(a,b))return {a:a,b:b,op:t,ans:a-b};}
  }}
 return {a:50,b:20,op:"-",ans:30};
}
function make(m,L){return gen(m==="A"?"+":m==="B"?"-":(Math.random()<.5?"+":"-"),L);}
function pick(a){return a[r(0,a.length-1)];}
function nm(){return S.name?", "+esc(S.name):"";}
/* ---------- screens ---------- */
function welcome(){
 app.innerHTML='<h1>Maths Adventure</h1><p class="sub">Welcome! What is your name?</p><div class="card"><input id="nmi" maxlength="20" placeholder="Type your name" autocomplete="off"><button class="btn" id="go">Let’s go!</button></div>';
 var i=document.getElementById("nmi");
 document.getElementById("go").onclick=function(){var v=i.value.trim();if(!v){i.focus();return;}S.name=v;save();home();};
}
function home(){
 if(!S.name)return welcome();
 var h='<h1>Hello, '+esc(S.name)+'! 👋</h1><p class="sub">Pick a module to practise.</p><div style="width:100%">';
 for(var k in MODS){h+='<button class="mod" data-m="'+k+'"><span class="l">'+MODS[k].s+'</span><span><b>Module '+k+' · '+MODS[k].n+'</b>Level '+Math.min(S.prog[k],NL)+' of '+NL+' unlocked</span></button>';}
 h+='</div><div class="foot"><button class="btn alt sm" id="par">👨‍👩‍👧 Parent area</button></div>';
 app.innerHTML=h;
 app.querySelectorAll(".mod").forEach(function(b){b.onclick=function(){levels(b.dataset.m);};});
 document.getElementById("par").onclick=gate;
}
function levels(m){
 mod=m;var h='<h1>Module '+m+' · '+MODS[m].n+'</h1><p class="sub">Score '+PASS+' or more out of '+TOTAL+' to unlock the next level.</p><div class="card" style="padding:10px 16px">';
 for(var i=0;i<NL;i++){var ok=i<S.prog[m],bs=S.best[m+i];
  h+='<button class="lvl" '+(ok?'':'disabled')+' data-l="'+i+'"><b>'+(ok?'':'🔒 ')+'Level '+(i+1)+(bs!=null?'<small>Best '+bs+'/'+TOTAL+'</small>':'')+'</b>'+LDESC[m][i]+'</button>';}
 app.innerHTML=h+'</div><button class="btn alt" id="bk">◀ Back</button>';
 app.querySelectorAll(".lvl").forEach(function(b){b.onclick=function(){start(m,+b.dataset.l);};});
 document.getElementById("bk").onclick=home;
}
function start(m,L){mod=m;lvl=L;qs=[];wrongNow=[];var seen={};while(qs.length<TOTAL){var q=make(m,L),k=q.a+q.op+q.b;if(!seen[k]){seen[k]=1;qs.push(q);}}qi=0;score=0;draw();}
function draw(){
 var q=qs[qi];entry="";locked=false;
 app.innerHTML='<div class="top"><span>Module '+mod+' · Level '+(lvl+1)+'</span><span>⭐ '+score+'</span></div><div class="bar"><i style="width:'+(qi/TOTAL*100)+'%"></i></div>'+
 '<div class="card"><div>Question '+(qi+1)+' of '+TOTAL+'</div><div class="sum"><div class="row"><span class="op"></span><span class="num">'+q.a+'</span></div>'+
 '<div class="row"><span class="op">'+(q.op==="+"?"+":"−")+'</span><span class="num">'+q.b+'</span></div><div class="rule"></div><div id="ans"><span class="hint">tap here</span></div></div><div id="msg"></div></div>'+
 '<div id="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>';}).join("")+'<button class="back" data-k="b">⌫</button><button data-k="0">0</button><button class="enter" data-k="e">Enter</button></div>';
 document.getElementById("ans").onclick=function(){if(!locked){document.getElementById("pad").classList.add("show");this.classList.add("active");show();}};
 document.querySelectorAll("#pad button").forEach(function(b){b.onclick=function(){key(b.dataset.k);};});
}
function show(){var a=document.getElementById("ans");a.innerHTML=entry?entry:'<span class="hint">type your answer</span>';}
function key(k){
 if(locked)return;
 if(k==="b")entry=entry.slice(0,-1);
 else if(k==="e"){if(entry!=="")check();return;}
 else if(entry.length<4)entry+=k;
 show();
}
function check(){
 locked=true;var q=qs[qi],a=document.getElementById("ans"),m=document.getElementById("msg"),ok=(+entry===q.ans);
 if(ok){score++;a.classList.add("good");m.style.color="var(--good)";m.textContent=pick(["Brilliant","Well done","Great job","Spot on","Super"])+(S.name?", "+S.name:"")+"!";}
 else{a.classList.add("bad");m.style.color="var(--bad)";m.textContent="Not quite. The answer is "+q.ans;
  wrongNow.push({m:mod,l:lvl+1,q:q.a+" "+(q.op==="+"?"+":"−")+" "+q.b,c:q.ans,u:+entry,t:Date.now()});}
 document.getElementById("pad").classList.remove("show");
 setTimeout(function(){qi++;qi<TOTAL?draw():finish();},ok?900:2300);
}
function finish(){
 var pass=score>=PASS,last=lvl===NL-1,h='<div class="card" style="margin-top:26px">';
 var stars=score>=TOTAL?"⭐⭐⭐":score>=PASS?"⭐⭐":score>=15?"⭐":"";
 if(pass&&!last&&S.prog[mod]<lvl+2)S.prog[mod]=lvl+2;
 if(S.best[mod+lvl]==null||score>S.best[mod+lvl])S.best[mod+lvl]=score;
 S.plays.push({m:mod,l:lvl+1,s:score,t:Date.now()});if(S.plays.length>100)S.plays=S.plays.slice(-100);
 S.wrong=S.wrong.concat(wrongNow).slice(-80);save();
 h+='<div class="big">'+(pass?'🎉':'💪')+'</div><div class="stars">'+stars+'</div><h1>'+score+' out of '+TOTAL+'</h1>';
 if(pass&&last)h+='<p>Well done'+nm()+'! You have finished every level of Module '+mod+'!</p>';
 else if(pass)h+='<p>Amazing'+nm()+'! Level '+(lvl+2)+' is now open.</p>';
 else h+='<p>Nearly there'+nm()+'. You need '+PASS+' to move on. Have another go!</p>';
 if(pass&&!last)h+='<button class="btn" id="nx">Next level ▶</button><br>';
 h+='<button class="btn alt" id="rt">Play again</button><br><button class="btn alt" id="mn">Menu</button></div>';
 app.innerHTML=h;
 var nx=document.getElementById("nx");if(nx)nx.onclick=function(){start(mod,lvl+1);};
 document.getElementById("rt").onclick=function(){start(mod,lvl);};
 document.getElementById("mn").onclick=home;
}
/* ---------- parent area ---------- */
function gate(){
 var a=r(6,9),b=r(6,9);
 app.innerHTML='<h1>Parent area</h1><div class="card"><p>To enter, answer: <b>'+a+' × '+b+' = ?</b></p><input id="gi" inputmode="numeric" placeholder="Answer"><button class="btn" id="gg">Enter</button><div id="ge" style="color:var(--bad);min-height:24px;margin-top:8px"></div></div><button class="btn alt" id="bk">◀ Back</button>';
 document.getElementById("gg").onclick=function(){if(+document.getElementById("gi").value===a*b)parent();else document.getElementById("ge").textContent="Try again";};
 document.getElementById("bk").onclick=home;
}
function fmt(t){var d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function parent(){
 var h='<h1>Progress for '+esc(S.name||"your child")+'</h1><div class="card"><h2>Best scores</h2><table class="tbl"><tr><th></th><th>L1</th><th>L2</th><th>L3</th><th>L4</th></tr>';
 for(var k in MODS){h+='<tr><th>'+k+' '+MODS[k].s+'</th>';for(var i=0;i<NL;i++){var b=S.best[k+i];h+='<td>'+(b!=null?b+'/'+TOTAL:(i<S.prog[k]?'–':'🔒'))+'</td>';}h+='</tr>';}
 h+='</table></div><div class="card"><h2>Sums answered wrongly</h2>';
 var w=S.wrong.slice().reverse().slice(0,40);
 if(!w.length)h+='<p>No mistakes recorded yet.</p>';
 w.forEach(function(x){h+='<div class="wr"><b>'+x.q+' = '+x.c+'</b> &nbsp; she wrote '+x.u+' <em>· Module '+x.m+' L'+x.l+' · '+fmt(x.t)+'</em></div>';});
 h+='</div><div class="card"><h2>Recent plays</h2>';
 var p=S.plays.slice().reverse().slice(0,8);
 if(!p.length)h+='<p>Nothing yet.</p>';
 p.forEach(function(x){h+='<div class="wr">Module '+x.m+' · Level '+x.l+': <b>'+x.s+'/'+TOTAL+'</b> <em>· '+fmt(x.t)+'</em></div>';});
 h+='</div><div class="card"><button class="btn alt sm" id="cn">Change name</button> <button class="btn alt sm" id="rs">Reset all progress</button></div><button class="btn alt" id="bk">◀ Back</button>';
 app.innerHTML=h;resetArm=false;
 document.getElementById("bk").onclick=home;
 document.getElementById("cn").onclick=function(){S.name="";save();welcome();};
 document.getElementById("rs").onclick=function(){var b=this;if(!resetArm){resetArm=true;b.textContent="Tap again to confirm";b.style.background="var(--bad)";b.style.color="#fff";}else{S=blank();save();welcome();}};
}
home();
</script>
</body>
</html>
